name: firstrproject
description: Libyan Expense Hub – Flutter version
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.2
  intl: ^0.20.2
  fl_chart: ^0.69.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1
  flutter_tesseract_ocr: 0.4.31
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tessdata_config.json
    - assets/tessdata/
